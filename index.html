<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 塔斯曼尼亞 10日自駕 (V59 全行程滿血版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #F8FAFC; overscroll-behavior-y: none; margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .soft-shadow { box-shadow: 0 4px 25px rgba(37, 99, 235, 0.15); }
        [v-cloak] { display: none !important; }
        .remarks-box { background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%); border: 2px dashed #BFDBFE; border-radius: 20px; }
        .price-highlight { color: #C62828; font-weight: 900; background-color: #FFEBEE; padding: 2px 6px; border-radius: 6px; }
        .nav-btn-google { background: linear-gradient(to right, #3B82F6, #2563EB); color: white; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3); }
        .nav-btn-apple { background: linear-gradient(to right, #374151, #111827); color: white; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.3); }
        .daily-title-box { background-color: #1E3A8A; color: white; border-radius: 16px; padding: 12px 16px; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2); margin-bottom: 16px; }
    </style>
</head>
<body class="text-slate-700 antialiased">
    <div id="app" v-cloak class="h-full flex flex-col relative">
        <div class="relative h-[220px] flex-shrink-0 bg-cover bg-center shadow-md" style="background-image: url('./header.png'), url('./header.jpg');">
            <div class="absolute inset-0 bg-gradient-to-b from-slate-900/30 to-slate-900/70"></div>
            <div class="absolute bottom-6 right-4 flex space-x-3 z-20">
                <button @click="currentTab = 'itinerary'" :class="tabClass('itinerary')"><i class="fa-solid fa-map-location-dot"></i></button>
                <button @click="currentTab = 'info'" :class="tabClass('info')"><i class="fa-solid fa-circle-info"></i></button>
                <button @click="currentTab = 'shopping'" :class="tabClass('shopping')"><i class="fa-solid fa-basket-shopping"></i></button>
                <button @click="currentTab = 'expenses'" :class="tabClass('expenses')"><i class="fa-solid fa-dollar-sign"></i></button>
            </div>
            <div class="absolute bottom-8 left-6 text-white drop-shadow-md">
                <h1 class="text-2xl font-bold tracking-widest">TASMANIA 2026</h1>
                <p class="text-sm opacity-90"><i class="fa-solid fa-earth-oceania mr-1 text-tas-300"></i>10 日行程全歸位版</p>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-t-[30px] -mt-6 relative z-10 overflow-hidden flex flex-col shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
            <div class="flex-1 overflow-y-auto no-scrollbar p-5 pb-24">
                <div v-if="currentTab === 'itinerary'">
                    <div class="flex space-x-3 overflow-x-auto no-scrollbar mb-6 py-2">
                        <div v-for="(day, index) in days" :key="index" @click="selectedDayIndex = index"
                             class="flex-shrink-0 flex flex-col items-center justify-center w-16 h-20 rounded-2xl transition-all duration-300 snap-center cursor-pointer border border-gray-100"
                             :class="selectedDayIndex === index ? 'bg-tas-600 text-white shadow-lg scale-105' : 'bg-white text-gray-400 border-gray-200'">
                            <span class="text-xs font-bold uppercase">{{ day.weekday }}</span>
                            <span class="text-xl font-bold">{{ day.date }}</span>
                            <span class="text-[10px] opacity-80">Day {{ day.dayNum }}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-blue-50 to-tas-100 rounded-2xl p-4 mb-4 flex items-center justify-between shadow-sm text-slate-700 border border-blue-100">
                        <div><div class="text-xs opacity-70 flex items-center gap-1"><i class="fa-solid fa-location-dot text-tas-500"></i> {{ weather.city_name }}</div><div class="text-2xl font-bold text-tas-700">{{ weather.temp }}°C</div></div>
                        <i :class="['fa-solid', weather.icon, 'text-4xl text-yellow-400']"></i>
                    </div>

                    <div v-if="dailyMainTitles[selectedDayIndex]" class="daily-title-box">
                        <h2 class="text-[14px] font-bold leading-tight" v-html="dailyMainTitles[selectedDayIndex]"></h2>
                    </div>

                    <div v-if="dailyRemarks[selectedDayIndex]" class="remarks-box p-4 mb-8 soft-shadow">
                        <div class="text-sm font-black text-tas-700 mb-2 border-b-2 border-tas-200 pb-1">今日重點提醒</div>
                        <div class="text-xs space-y-3 leading-relaxed" v-html="formatText(dailyRemarks[selectedDayIndex])"></div>
                    </div>

                    <div class="space-y-0 relative">
                        <div class="absolute left-[22px] top-4 bottom-4 w-0.5 bg-tas-200 opacity-50 z-0"></div>
                        <div v-for="(item, idx) in currentDayItinerary" :key="item.id" class="relative pl-12 pb-14 group">
                            <div v-if="item.travelTime" class="absolute -top-9 left-12 right-0 flex items-center text-xs text-tas-600 mb-2 z-50">
                                <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-200 flex items-center gap-1.5 shadow-sm font-black whitespace-nowrap">
                                    <i :class="getTransportIcon(item.transportType)"></i> {{ item.travelTime }}
                                </span>
                            </div>
                            <div class="absolute left-0 top-4 w-11 h-11 rounded-full bg-white border-4 border-tas-100 flex items-center justify-center z-10 shadow-sm text-tas-600 font-bold text-xs" :class="{'bg-tas-600 text-white border-tas-200': item.category === 'hotel'}">{{ item.time.split(':')[0] }}</div>
                            <div class="bg-white rounded-2xl p-4 soft-shadow relative border border-gray-50 transition-all active:scale-[0.98]" :class="{'border-l-4 border-orange-400': item.category === 'flight', 'border-l-4 border-purple-400': item.category === 'hotel', 'border-l-4 border-tas-500': item.category !== 'flight' && item.category !== 'hotel'}">
                                <div @click="openMap(item.location)">
                                    <div class="flex justify-between items-start mb-1"><div class="text-xs font-bold text-tas-500 uppercase tracking-wider">{{ item.time }} • {{ itemCategoryName(item.category) }}</div></div>
                                    <h3 class="text-lg font-bold mb-1 text-slate-800" v-html="formatText(item.title)"></h3>
                                    <div class="text-sm text-gray-500 mb-2 flex items-start gap-1.5" v-if="item.desc"><i class="fa-regular fa-note-sticky mt-1 text-[10px] flex-shrink-0 text-tas-400"></i><span class="whitespace-pre-line text-xs leading-relaxed" v-html="formatText(item.desc)"></span></div>
                                    <div v-if="item.info" class="mt-2 p-2 bg-red-50 rounded-lg text-xs text-red-600 border border-red-100 flex items-start gap-1.5"><i class="fa-solid fa-circle-exclamation mt-0.5 flex-shrink-0"></i><span class="font-bold leading-relaxed" v-html="formatText(item.info)"></span></div>
                                    <div class="flex flex-wrap gap-2 mt-3 items-center">
                                        <span v-if="item.transportType === 'car'" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-md font-bold border border-blue-100"><i class="fa-solid fa-car mr-1"></i>自駕</span>
                                        <span v-if="item.transportType === 'walk'" class="text-[10px] bg-green-50 text-green-600 px-2 py-1 rounded-md font-bold border border-green-100"><i class="fa-solid fa-person-walking mr-1"></i>步行</span>
                                        <button v-if="item.location" @click.stop="openMap(item.location, 'google')" class="text-[10px] nav-btn-google px-2.5 py-1.5 rounded-md font-bold">Google</button>
                                        <button v-if="item.location" @click.stop="openMap(item.location, 'apple')" class="text-[10px] nav-btn-apple px-2.5 py-1.5 rounded-md font-bold">Apple</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    currentTab: `itinerary`, selectedDayIndex: 0, exchangeRate: 5.2,
                    weather: { city_name: `Hobart`, temp: `13`, icon: `fa-cloud-sun` },
                    days: [{ weekday: `Thu`, date: `5/21`, dayNum: `0` }, { weekday: `Fri`, date: `5/22`, dayNum: `1` }, { weekday: `Sat`, date: `5/23`, dayNum: `2` }, { weekday: `Sun`, date: `5/24`, dayNum: `3` }, { weekday: `Mon`, date: `5/25`, dayNum: `4` }, { weekday: `Tue`, date: `5/26`, dayNum: `5` }, { weekday: `Wed`, date: `5/27`, dayNum: `6` }, { weekday: `Thu`, date: `5/28`, dayNum: `7` }, { weekday: `Fri`, date: `5/29`, dayNum: `8` }, { weekday: `Sat`, date: `5/30`, dayNum: `9` }, { weekday: `Sun`, date: `5/31`, dayNum: `10` }],
                    dailyMainTitles: { 0: `✈️ 香港 – 出發 → 悉尼（轉機）`, 1: `🛬 Hobart – 抵達 → 海濱散步 → 晚餐`, 2: `🖼️ Hobart – Salamanca Market → MONA → Frank`, 3: `🐚 海鮮 Cruise → 🚗 取車 → ⛰️ Mt Wellington`, 4: `🏙️ Hobart – 市區漫遊 → Waterfront 晚餐`, 5: `🏙️ Hobart → 🚗 Bruny Island 一日遊`, 6: `🏝️ Triabunna → ⛴️ Maria Island → 🚗 Bicheno`, 7: `🚗 Wineglass Bay → Oyster Tour → Devonport`, 8: `🏔️ Stanley → Cradle Mountain → Launceston`, 9: `✈️ Launceston → Sydney（轉機）`, 10: `✈️ Sydney → 香港` },
                    dailyRemarks: { 0: `🧭 轉機提醒：T1 到 T2 需轉乘接駁。\n🧥 貼士：夜機冷氣強。`, 5: `⛴️ 渡輪：<span class="price-highlight">A$55.8/車</span>。\n🥩 餐廳：<span class="font-bold text-green-600">✅ 已BOOK 6pm Frank</span>。`, 8: `🏔️ 關鍵日：12:00 離開 Cradle 是今日行程關鍵。\n🥩 餐廳：<span class="font-bold text-green-600">✅ 已BOOK 7pm Black Cow</span>。`, 9: `🏨 住宿：<span class="font-black text-red-600 bg-yellow-300">⚠️ 30-31May 後補</span>。` },
                    itineraryData: [
                        // Day 0: 5/21
                        [ { id: 0, time: `17:30`, title: `香港國際機場`, category: `transport`, desc: `QF128\n建議提早 2 小時前到機`, location: `HKIA`, transportType: `walk` }, { id: 1, time: `19:30`, title: `QF128 飛往悉尼`, category: `flight`, desc: `飛行時間約 9h15m\n到達：SYD T1 (國際)`, travelTime: `9h 15m (7,390 km)`, transportType: `flight` } ],
                        // Day 1: 5/22
                        [ { id: 101, time: `06:45`, title: `悉尼機場`, category: `transport`, desc: `Terminal 1 to Terminal 2\n預留充足時間提取行李`, location: `Sydney Airport T2` }, { id: 102, time: `12:05`, title: `霍巴特國際機場`, category: `flight`, desc: `QF5721`, travelTime: `1h 50m (1,040 km)`, transportType: `flight`, location: `Hobart Airport` }, { id: 103, time: `14:30`, title: `44 Church St`, category: `hotel`, desc: `Airbnb, By Taxi around AUD 45-65`, location: `44 Church St, North Hobart`, travelTime: `20m (19 km)`, transportType: `car` }, { id: 104, time: `15:00`, title: `🏠 【梳洗時間】`, category: `hotel`, desc: `1 小時洗臉小休` }, { id: 105, time: `16:30`, title: `海濱散步`, category: `sightseeing`, desc: `• Woolworths Hobart CBD 補給\n• Brooke Street Pier 先認位置`, location: `Brooke Street Pier`, travelTime: `25m 步行`, transportType: `walk` } ],
                        // Day 2: 5/23
                        [ { id: 201, time: `08:00`, title: `☕ 早餐`, category: `food`, desc: `Machine Laundry Cafe`, location: `Salamanca Square`, transportType: `walk` }, { id: 202, time: `08:30`, title: `🎪 Salamanca Market`, category: `shopping`, desc: `Smith's pie: Scallops pie`, travelTime: `2h 逛足`, location: `Salamanca Market`, transportType: `walk` }, { id: 203, time: `10:30`, title: `🚤 前往 MONA 渡輪`, category: `transport`, desc: `11:15 班次`, travelTime: `8m 步行 (650 m)`, location: `Brooke Street Pier`, transportType: `walk` }, { id: 204, time: `11:45`, title: `🖼️ MONA`, category: `sightseeing`, desc: `Museum Ticket: AUD 39 adult`, location: `MONA`, travelTime: `25m 船程`, transportType: `ship` }, { id: 205, time: `18:00`, title: `🍽️ Frank Restaurant`, category: `food`, desc: `<span class="font-bold text-green-600">✅ 已BOOK 6pm</span>`, location: `Frank Restaurant Hobart`, transportType: `walk` } ],
                        // Day 3: 5/24
                        [ { id: 301, time: `08:30`, title: `☕ 早餐`, category: `food`, desc: `Hobart Coffee Roasters`, location: `Hobart Coffee Roasters`, transportType: `walk` }, { id: 302, time: `10:00`, title: `🐚 Seafood Cruise`, category: `food`, desc: `Tasmanian Wild Seafood Adventures`, location: `Elizabeth Street Pier`, transportType: `ship` }, { id: 303, time: `15:00`, title: `22 Cherokee Dr`, category: `transport`, desc: `拎車`, location: `22 Cherokee Dr, Cambridge TAS`, travelTime: `15m`, transportType: `car` }, { id: 304, time: `16:00`, title: `⛰️ Mount Wellington`, category: `sightseeing`, desc: `俯瞰 Hobart 景觀`, location: `Mount Wellington`, travelTime: `40m (33 km)`, transportType: `car` } ],
                        // Day 4: 5/25
                        [ { id: 401, time: `10:00`, title: `🏛️ Salamanca Place`, category: `shopping`, desc: `木藝、陶器、設計小物`, location: `Salamanca Place`, transportType: `walk` }, { id: 402, time: `13:45`, title: `🏡 Kelly's Steps`, category: `sightseeing`, desc: `經典古老石階`, location: `Kelly's Steps`, transportType: `walk` }, { id: 403, time: `14:30`, title: `🏘️ Arthur Circus Park`, category: `sightseeing`, desc: `彩色小屋`, location: `Arthur Circus Park`, transportType: `walk` }, { id: 404, time: `18:15`, title: `🍽️ Da Angelo Ristorante`, category: `food`, desc: `<span class="font-bold text-green-600">✅ 已BOOK 6:15pm</span>`, location: `Da Angelo Ristorante`, transportType: `walk` } ],
                        // Day 5: 5/26
                        [ { id: 501, time: `08:15`, title: `🚗 前往 Kettering`, category: `transport`, desc: `準備搭渡輪`, location: `Kettering Ferry Terminal`, travelTime: `35m (34 km)`, transportType: `car` }, { id: 502, time: `09:40`, title: `📸 Truganini Lookout`, category: `sightseeing`, desc: `眺望 The Neck`, location: `The Neck Lookout`, travelTime: `25m (23 km)`, transportType: `car` }, { id: 503, time: `12:30`, title: `🗼 Cape Bruny Lighthouse`, category: `sightseeing`, desc: `南端燈塔 (路窄慢駛)`, location: `Cape Bruny Lighthouse`, travelTime: `1h`, transportType: `car` }, { id: 504, time: `18:00`, title: `🍽️ Frank Restaurant`, category: `food`, desc: `<span class="font-bold text-green-600">✅ 已BOOK 6pm</span>`, location: `Frank Restaurant Hobart` } ],
                        // Day 6: 5/27
                        [ { id: 601, time: `08:20`, title: `Triabunna 報到`, category: `transport`, desc: `Maria Island Gateway`, location: `Triabunna Wharf`, travelTime: `1h 15m (85 km)`, transportType: `car` }, { id: 602, time: `10:00`, title: `⛴️ Maria Island Ferry`, category: `transport`, desc: `10:00去 / 14:15返`, travelTime: `30m`, transportType: `ship` }, { id: 603, time: `10:30`, title: `🐨 Darlington 歷史村`, category: `sightseeing`, desc: `睇袋熊與遺址`, location: `Darlington`, transportType: `walk` }, { id: 604, time: `18:30`, title: `🐧 Bicheno 企鵝導賞`, category: `sightseeing`, desc: `夜觀企鵝歸巢`, location: `Bicheno Penguin Tours`, transportType: `car` } ],
                        // Day 7: 5/28
                        [ { id: 701, time: `08:45`, title: `⛰️ Wineglass Bay Lookout`, category: `sightseeing`, location: `Wineglass Bay Lookout`, travelTime: `35m (38 km)`, transportType: `car` }, { id: 702, time: `11:00`, title: `🦪 Oyster Bay Tours`, category: `food`, desc: `食生蠔 Tour`, location: `Freycinet Marine Farm`, transportType: `car` }, { id: 703, time: `16:00`, title: `Devonport 補給`, category: `shopping`, location: `Woolworths Devonport`, travelTime: `1h 41m`, transportType: `car` }, { id: 704, time: `20:00`, title: `🏘️ 241 William St`, category: `hotel`, location: `241 William St, Devonport`, transportType: `car` } ],
                        // Day 8: 5/29
                        [ { id: 801, time: `08:40`, title: `📸 Godfreys Beach`, category: `sightseeing`, desc: `拍攝 The Nut`, location: `Godfreys Beach`, travelTime: `1h 25m (126 km)`, transportType: `car` }, { id: 802, time: `11:50`, title: `Cradle Mt 遊客中心`, category: `transport`, desc: `買 Shuttle 票`, location: `Cradle Mountain Visitor Centre`, travelTime: `2h 15m (181 km)`, transportType: `car` }, { id: 803, time: `13:00`, title: `🥾 Dove Lake 步道`, category: `sightseeing`, desc: `環湖 60m`, location: `Dove Lake`, transportType: `bus` }, { id: 804, time: `19:00`, title: `🥩 Black Cow Bistro`, category: `food`, desc: `<span class="font-bold text-green-600">✅ 已BOOK 7pm</span>`, location: `Black Cow Bistro`, transportType: `walk` } ],
                        // Day 9: 5/30
                        [ { id: 901, time: `08:20`, title: `Launceston 機場`, category: `transport`, location: `Launceston Airport`, travelTime: `15m`, transportType: `car` }, { id: 902, time: `09:45`, title: `🛫 飛往悉尼`, category: `flight`, desc: `QF5746`, transportType: `flight`, travelTime: `1h 40m` }, { id: 903, time: `14:00`, title: `Sydney 市中心散步`, category: `sightseeing`, desc: `歌劇院與海港大橋`, location: `Sydney Opera House`, transportType: `walk` }, { id: 904, time: `20:45`, title: `悉尼住宿後補`, category: `hotel`, desc: `<span class="price-highlight">⚠️ 30-31May 後補</span>`, location: `Sydney Airport` } ],
                        // Day 10: 5/31
                        [ { id: 1001, time: `08:30`, title: `悉尼機場 T1`, category: `transport`, location: `Sydney Airport T1`, transportType: `car` }, { id: 1002, time: `10:10`, title: `🛫 返回香港`, category: `flight`, desc: `QF127`, travelTime: `9h 45m`, transportType: `flight` } ]
                    ]
                }
            },
            watch: { selectedDayIndex() { this.updateWeather(); } },
            methods: {
                updateWeather() {
                    const cityMap = { 0: "Sydney", 1: "Hobart", 2: "Hobart", 3: "Hobart", 4: "Hobart", 5: "Hobart", 6: "Bicheno", 7: "Devonport", 8: "Cradle Mountain", 9: "Sydney", 10: "Sydney" };
                    this.weather.city_name = cityMap[this.selectedDayIndex];
                    const temps = { "Sydney": "21", "Hobart": "13", "Bicheno": "14", "Devonport": "14", "Cradle Mountain": "7" };
                    this.weather.temp = temps[this.weather.city_name] || "13";
                },
                openMap(loc, provider) {
                    if (!loc) return;
                    const url = provider === 'apple' ? `http://maps.apple.com/?q=${encodeURIComponent(loc)}` : `https://www.google.com/maps/search/?api=1&query=` + encodeURIComponent(loc);
                    window.open(url, '_blank');
                },
                formatText(text) { return text ? String(text).replace(/\n/g, '<br>') : ''; },
                tabClass(tab) { return this.currentTab === tab ? 'bg-tas-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center transform scale-110' : 'bg-white/90 text-tas-600 w-10 h-10 rounded-full shadow flex items-center justify-center'; },
                getTransportIcon(type) { const map = { walk: 'fa-person-walking', car: 'fa-car', flight: 'fa-plane', ship: 'fa-ship', bus: 'fa-bus' }; return `fa-solid ${map[type] || 'fa-arrow-right'}`; },
                itemCategoryName(cat) { const map = { sightseeing: '景點', food: '美食', shopping: '購物', transport: '交通', hotel: '住宿', flight: '航班' }; return map[cat] || '其他'; }
            },
            mounted() { this.updateWeather(); }
        }).mount('#app');
    </script>
</body>
</html>
